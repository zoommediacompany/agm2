<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WILD Admin</title><link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">WILD</div><p class="eyebrow">Management portal</p><h1>Application desk</h1><p class="muted">Sign in to review submitted applications.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="alert {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><label>Password<input name="password" type="password" required autofocus></label><button type="submit">Sign in <span>&rarr;</span></button></form></main></body></html>
