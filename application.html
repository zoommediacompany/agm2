<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WILD | Application Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 px-4 py-12 text-slate-900">
  <main class="mx-auto max-w-2xl rounded-3xl bg-white p-6 shadow-2xl sm:p-10">
    <a href="index.html" class="font-bold text-blue-600">← Back to WILD</a>

    <h1 class="mt-8 text-4xl font-extrabold">Apply to WILD</h1>
    <p class="mt-3 text-slate-500">
      Complete the form below to begin your WILD experience.
    </p>

    <form action="#" method="post" enctype="multipart/form-data" class="mt-8 space-y-5">
      <div>
        <label for="name" class="font-semibold">Full name</label>
        <input id="name" name="name" type="text" required
          class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" />
      </div>

      <div>
        <label for="email" class="font-semibold">Email address</label>
        <input id="email" name="email" type="email" required
          class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" />
      </div>

      <div>
        <label for="phone" class="font-semibold">Phone number</label>
        <input id="phone" name="phone" type="tel" required
          class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" />
      </div>

      <div>
        <label for="program" class="font-semibold">Program of interest</label>
        <select id="program" name="program" required
          class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
          <option value="">Select a program</option>
          <option>Study Abroad</option>
          <option>Cultural Exchange</option>
          <option>Educational Travel</option>
        </select>
      </div>

      <div>
        <label for="resume" class="font-semibold">Upload document</label>
        <input id="resume" name="resume" type="file"
          class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" />
      </div>

      <button type="submit"
        class="w-full rounded-xl bg-blue-600 px-6 py-4 font-bold text-white hover:bg-blue-700">
        Submit Application
      </button>
    </form>

    <a href="wild/application.html">Apply Now</a>
  </main>
</body>
</html>
